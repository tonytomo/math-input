<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Input</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="h-screen flex flex-col justify-center bg-zinc-900 text-white">
        <div id="editor" class="editor">
            <!-- Number -->
            <input type="number" class="auto-resize" value="20" />

            <input type="text" maxlength="1" value="+" />

            <!-- Fraction -->
            <div class="fraction">
                <input type="number" class="auto-resize" value="1" />
                <div class="bar"></div>
                <input type="number" class="auto-resize" value="2" />
            </div>

            <input type="text" maxlength="1" value="+" />

            <!-- Root -->
            <div class="root">
                <input type="number" class="index auto-resize" value="3" />
                <div class="radical">
                    <input type="number" class="auto-resize" value="64" />
                </div>
            </div>

            <input type="text" maxlength="1" value="·" />

            <!-- Exponent -->
            <div class="exponent">
                <input type="number" class="auto-resize" value="4" />
                <div class="power">
                    <input type="number" class="auto-resize" value="3" />
                </div>
            </div>

            <input type="text" maxlength="1" value="-" />

            <!-- Parentheses -->
            <div class="parentheses">
                <input type="number" class="auto-resize" value="-5" />
            </div>

            <input type="text" maxlength="1" value="·" />

            <!-- Absolute / Vertical Bar -->
            <div class="vertical-bar">
                <input type="number" class="auto-resize" value="-2" />
                <input type="text" maxlength="1" value="+" />
                <input type="number" class="auto-resize" value="-8" />
            </div>

            <input type="text" maxlength="1" value="-" />

            <!-- Factorial -->
            <div class="factorial">
                <input type="number" class="auto-resize" value="5" />
                <p>!</p>
            </div>

            <input type="text" maxlength="1" value="+" />

            <!-- Logarithm -->
            <div class="logarithm">
                <input type="number" class="base auto-resize" value="10" />
                <p>log</p>
                <div class="argument">
                    <p>(</p>
                    <input type="number" class="auto-resize" value="100" />
                    <p>)</p>
                </div>
            </div>

            <input type="text" maxlength="1" value="-" />

            <!-- Trigonometric Sine -->
            <div class="trigonometric">
                <p>sin</p>
                <div class="argument">
                    <p>(</p>
                    <input type="number" class="auto-resize" value="45" />
                    <input type="text" class="angle auto-resize" value="°" />
                    <p>)</p>
                </div>
            </div>

            <input type="text" maxlength="1" value="+" />

            <!-- Trigonometric Cosine -->
            <div class="trigonometric">
                <p>cos</p>
                <div class="argument">
                    <p>(</p>
                    <input type="number" class="auto-resize" value="60" />
                    <input type="text" class="angle auto-resize" value="°" />
                    <p>)</p>
                </div>
            </div>

            <input type="text" maxlength="1" value="+" />

            <!-- Trigonometric Tangent -->
            <div class="trigonometric">
                <p>tan</p>
                <div class="argument">
                    <p>(</p>
                    <input type="number" class="auto-resize" value="30" />
                    <input type="text" class="angle auto-resize" value="rad" />
                    <p>)</p>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
