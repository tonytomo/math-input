<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Input</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        input {
            font-family: "JetBrains Mono", monospace;
            font-optical-sizing: auto;
        }

        .square-root {
            transform: skewX(-20deg);
            border-left: 2px solid white;
            border-top: 2px solid white;
        }

        .square-root>* {
            transform: skewX(20deg);
        }

        .parentheses {
            border-left: 2px solid white;
            border-right: 2px solid white;
            border-radius: 0.5rem;
        }
    </style>
</head>

<body>
    <main class="h-screen flex flex-col justify-center bg-zinc-900 text-white">
        <div id="editor"
            class="bg-zinc-800 outline-none focus:ring-2 ring-zinc-600 min-h-16 p-16 font-sans text-xl flex items-center overflow-x-auto">
            <input type="number"
                class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                style="width: 2.5ch;height: 2.5ch;" value="0" />

            <input type="text"
                class="text-center focus:border border-zinc-500 border-dotted text-inherit bg-transparent outline-none"
                style="width: 2.5ch;height: 2.5ch;" value="+" />

            <!-- Fraction -->
            <div class="flex flex-col mx-2 items-center gap-2">
                <input type="number"
                    class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                    style="width: 2.5ch;height: 2.5ch;" value="0" />
                <div class="border-b-2 border-white self-stretch"></div>
                <input type="number"
                    class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                    style="width: 2.5ch;height: 2.5ch;" value="0" />
            </div>

            <input type="text"
                class="text-center focus:border border-zinc-500 border-dotted text-inherit bg-transparent outline-none"
                style="width: 2.5ch;height: 2.5ch;" value="+" />

            <!-- Nested Fraction -->
            <div class="flex flex-col mx-2 items-center gap-2">
                <div class="flex flex-col mx-2 items-center gap-2">
                    <input type="number"
                        class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                        style="width: 2.5ch;height: 2.5ch;" value="0" />
                    <div class="border-b-2 border-white self-stretch"></div>
                    <input type="number"
                        class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                        style="width: 2.5ch;height: 2.5ch;" value="0" />
                </div>
                <div class="border-b-2 border-white self-stretch"></div>
                <div class="flex flex-col mx-2 items-center gap-2">
                    <input type="number"
                        class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                        style="width: 2.5ch;height: 2.5ch;" value="0" />
                    <div class="border-b-2 border-white self-stretch"></div>
                    <input type="number"
                        class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                        style="width: 2.5ch;height: 2.5ch;" value="0" />
                </div>
            </div>

            <input type="text"
                class="text-center focus:border border-zinc-500 border-dotted text-inherit bg-transparent outline-none"
                style="width: 2.5ch;height: 2.5ch;" value="+" />

            <!-- Square Root -->
            <div class="relative px-2 pt-2 square-root ml-4 mr-2">
                <input type="number"
                    class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                    style="width: 2.5ch;height: 2.5ch;" value="0" />
                <input type="number"
                    class="auto-resize text-xs focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none absolute top-0 right-[calc(100%_+_1ch)]"
                    style="width: 1.5ch;height: 1.5ch;" value="2" />
            </div>

            <input type="text"
                class="text-center focus:border border-zinc-500 border-dotted text-inherit bg-transparent outline-none"
                style="width: 2.5ch;height: 2.5ch;" value="×" />

            <!-- Exponent -->
            <div class="relative">
                <input type="number"
                    class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                    style="width: 2.5ch;height: 2.5ch;" value="0" />
                <input type="number"
                    class="auto-resize text-xs focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none absolute top-0 left-[calc(100%_-_1ch)]"
                    style="width: 1.5ch;height: 1.5ch;" value="2" />
            </div>

            <input type="text"
                class="text-center focus:border border-zinc-500 border-dotted text-inherit bg-transparent outline-none"
                style="width: 2.5ch;height: 2.5ch;" value="×" />

            <!-- Parentheses -->
            <div class="relative p-2 parentheses mx-2 flex ">
                <input type="number"
                    class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                    style="width: 2.5ch;height: 2.5ch;" value="0" />
            </div>

            <input type="text"
                class="text-center focus:border border-zinc-500 border-dotted text-inherit bg-transparent outline-none"
                style="width: 2.5ch;height: 2.5ch;" value="×" />

            <!-- Fractions inside Parentheses -->
            <div class="relative p-2 parentheses mx-2">
                <div class="flex flex-col mx-2 items-center gap-2">
                    <input type="number"
                        class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                        style="width: 2.5ch;height: 2.5ch;" value="0" />
                    <div class="border-b-2 border-white self-stretch"></div>
                    <input type="number"
                        class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                        style="width: 2.5ch;height: 2.5ch;" value="0" />
                </div>
            </div>

            <input type="text"
                class="text-center focus:border border-zinc-500 border-dotted text-inherit bg-transparent outline-none"
                style="width: 2.5ch;height: 2.5ch;" value="×" />

            <!-- Complex Fraction with Square Root and Exponent -->
            <div class="flex flex-col mx-2 items-center gap-2">
                <!-- Numerator -->
                <div class="relative px-2 pt-2 square-root ml-4 mr-2">
                    <input type="number"
                        class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                        style="width: 2.5ch;height: 2.5ch;" value="0" />
                    <input type="number"
                        class="auto-resize text-xs focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none absolute top-0 right-[calc(100%_+_1ch)]"
                        style="width: 1.5ch;height: 1.5ch;" value="2" />
                </div>

                <div class="border-b-2 border-white self-stretch"></div>

                <!-- Denominator -->
                <div class="relative p-2 parentheses mx-2 flex ">
                    <div class="relative px-2 pt-2 square-root ml-4 mr-2">
                        <input type="number"
                            class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                            style="width: 2.5ch;height: 2.5ch;" value="0" />
                        <input type="number"
                            class="auto-resize text-xs focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none absolute top-0 right-[calc(100%_+_1ch)]"
                            style="width: 1.5ch;height: 1.5ch;" value="2" />
                    </div>

                    <input type="text"
                        class="text-center focus:border border-zinc-500 border-dotted text-inherit bg-transparent outline-none"
                        style="width: 2.5ch;height: 2.5ch;" value="×" />

                    <!-- Exponent -->
                    <div class="relative">
                        <input type="number"
                            class="auto-resize focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none"
                            style="width: 2.5ch;height: 2.5ch;" value="0" />
                        <input type="number"
                            class="auto-resize text-xs focus:border border-zinc-500 border-dotted text-center text-inherit bg-transparent outline-none absolute top-0 left-[calc(100%_-_1ch)]"
                            style="width: 1.5ch;height: 1.5ch;" value="2" />
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
