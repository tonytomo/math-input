<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Input</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="h-screen flex flex-col justify-center bg-zinc-900 text-white">
        <div id="editor" class="editor">
            <!-- Number -->
            <input type="number" class="auto-resize" value="0" />

            <input type="text" maxlength="1" value="+" />

            <!-- Fraction -->
            <div class="fraction">
                <input type="number" class="auto-resize" value="0" />
                <div class="bar"></div>
                <input type="number" class="auto-resize" value="0" />
            </div>

            <input type="text" maxlength="1" value="-" />

            <!-- Nested Fraction -->
            <div class="fraction">
                <div class="fraction">
                    <input type="number" class="auto-resize" value="0" />
                    <div class="bar"></div>
                    <input type="number" class="auto-resize" value="0" />
                </div>
                <div class="bar"></div>
                <div class="fraction">
                    <input type="number" class="auto-resize" value="0" />
                    <div class="bar"></div>
                    <input type="number" class="auto-resize" value="0" />
                </div>
            </div>

            <input type="text" maxlength="1" value="+" />

            <!-- Root -->
            <div class="root">
                <input type="number" class="index auto-resize" value="2" />
                <div class="radical">
                    <input type="number" class="auto-resize" value="0" />
                </div>
            </div>

            <input type="text" maxlength="1" value="·" />

            <!-- Exponent -->
            <div class="exponent">
                <input type="number" class="auto-resize" value="0" />
                <div class="power">
                    <input type="number" class="auto-resize" value="2" />
                </div>
            </div>

            <input type="text" maxlength="1" value="-" />

            <!-- Exponent Operation -->
            <div class="exponent">
                <input type="number" class="auto-resize" value="0" />
                <div class="power">
                    <input type="number" class="auto-resize" value="0" />
                </div>
            </div>

            <input type="text" maxlength="1" value="-" />

            <!-- Parentheses -->
            <div class="parentheses">
                <input type="number" class="auto-resize" value="0" />
            </div>

            <input type="text" maxlength="1" value="·" />

            <!-- Absolute / Vertical Bar -->
            <div class="vertical-bar">
                <input type="number" class="auto-resize" value="0" />
                <input type="text" maxlength="1" value="+" />
                <input type="number" class="auto-resize" value="0" />
            </div>

            <input type="text" maxlength="1" value="·" />

            <!-- Fractions inside Parentheses -->
            <div class="parentheses">
                <div class="fraction">
                    <input type="number" class="auto-resize" value="0" />
                    <div class="bar"></div>
                    <input type="number" class="auto-resize" value="0" />
                </div>
            </div>

            <input type="text" maxlength="1" value="-" />

            <!-- Complex Fraction with Square Root and Exponent -->
            <div class="fraction">
                <!-- Numerator -->
                <div class="root">
                    <input type="number" class="index auto-resize" value="2" />
                    <div class="radical">
                        <input type="number" class="auto-resize" value="0" />
                    </div>
                </div>

                <div class="bar"></div>

                <!-- Denominator -->
                <div class="parentheses">
                    <div class="root">
                        <input type="number" class="index auto-resize" value="2" />
                        <div class="radical">
                            <input type="number" class="auto-resize" value="0" />
                        </div>
                    </div>

                    <input type="text" maxlength="1" value="+" />

                    <!-- Exponent -->
                    <div class="exponent">
                        <input type="number" class="auto-resize" value="0" />
                        <div class="power">
                            <input type="number" class="auto-resize" value="2" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
